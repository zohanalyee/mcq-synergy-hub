    <!-- Boot recovery: if a main /assets/ script or stylesheet fails to load
         (old cached page after a publish), reload once with a fresh URL.
         No timer watchdog; never for bots or prerender. -->
    <script id="boot-recovery">
      (function (w) {
        var K = 'mcqsai:boot-reload-at';
        var BOT = /bot|crawl|spider|slurp|bingpreview|facebookexternalhit|whatsapp|telegram|lighthouse|headless|prerender|google-inspectiontool|mediapartners/i;
        function mainAsset(t) {
          if (!t || !t.tagName) return false;
          var n = String(t.tagName).toLowerCase();
          var u = n === 'script' ? t.src : (n === 'link' && /stylesheet/i.test(t.rel || '') ? t.href : '');
          return !!u && String(u).indexOf(w.location.origin + '/assets/') === 0;
        }
        w.addEventListener('error', function (e) {
          if (w.__PRERENDER__ || BOT.test(w.navigator.userAgent || '') || !mainAsset(e && e.target)) return;
          try {
            if (w.sessionStorage.getItem(K)) return;
            w.sessionStorage.setItem(K, String(Date.now()));
          } catch (x) { return; }
          var p = new URLSearchParams(w.location.search);
          p.set('v', String(Date.now()));
          w.location.replace(w.location.pathname + '?' + p.toString() + (w.location.hash || ''));
        }, true);
      })(window);
    </script>

    <!-- Wait for window load, then the service delay, then browser idle.
         A bounded timer also runs the callback when idle never arrives. -->
    <script>
      window.mcqsaiLoadAfterIdle = function (callback, delay) {
        function afterLoad() {
          window.setTimeout(function () {
            var done = false;
            var fallback;
            function run() {
              if (done) return;
              done = true;
              window.clearTimeout(fallback);
              callback();
            }
            fallback = window.setTimeout(run, 2000);
            if (window.requestIdleCallback) {
              window.requestIdleCallback(run, { timeout: 2000 });
            } else {
              window.clearTimeout(fallback);
              fallback = window.setTimeout(run, 0);
            }
          }, delay);
        }
        if (document.readyState === 'complete') afterLoad();
        else window.addEventListener('load', afterLoad, { once: true });
      };
    </script>

    </script>

    <!-- Microsoft Clarity — session recordings & heatmaps. The stub installs
         immediately so early events queue; the library is fetched only during
          idle time, at least 10 seconds after load. -->
    <script>

        // No Clarity on admin routes.
        if (/^\/admin(\/|$)/.test(location.pathname || '/')) return;
        window.clarity = window.clarity || function () { (window.clarity.q = window.clarity.q || []).push(arguments); };
        var loaded = false;
        function loadClarity() {
          if (loaded) return; loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.clarity.ms/tag/yugr76iqr3';
          document.head.appendChild(s);
        }
        // Short visits were being missed: shorten the delay, never load on input.
        window.mcqsaiLoadAfterIdle(loadClarity, 10000);
      })();
    </script>

          });
          return OneSignal.init({ appId: 'e9602eac-3cf8-4b17-a8e3-8aa58c184660' });

    <!-- Google Analytics 4 — the dataLayer/gtag stub is installed immediately so
         every event (page_view, heartbeats, scroll depth) is queued with its real
         timestamp; the gtag.js library is fetched during idle time, at least
          4 seconds after load, not by user input or page exit.
         Queued hits are flushed unchanged once the library loads. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      (function () {
        // No GA4 on admin routes; /test-session/<id> collapses to one page path.
        var path = (location.pathname || '/');
        if (/^\/admin(\/|$)/.test(path)) return;
        var pp = path.replace(/^\/test-session\/[^/]+/, '/test-session/:id') + (location.search || '');
        gtag('config', 'G-92HVL8ZQFC', { page_path: pp, page_location: location.origin + pp });
        var loaded = false;
        function loadGA() {
          if (loaded) return; loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-92HVL8ZQFC';
          document.head.appendChild(s);
        }
        // Short visits were being missed: shorten the delay, never load on input.
        window.mcqsaiLoadAfterIdle(loadGA, 4000);
      })();
